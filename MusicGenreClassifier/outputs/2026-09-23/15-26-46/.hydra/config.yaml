data:
  dataset_path: dataset/mfcc.npz
  batch_size: 32
  test_size: 0.15
  validation_size: 0.15
  n_mfcc: 13
  random_seed: 42
  use_deltas: false
  oversample_classes: []
  oversample_factor: 1.0
  aug_probability: 0.5
  aug_noise_std: 0.02
  aug_time_mask_max: 8
  aug_frequency_mask_max: 3
model:
  num_classes: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler_patience: 4
  scheduler_factor: 0.5
  dropout: 0.3
  channels:
  - 32
  - 64
  - 128
training:
  max_epochs: 100
  early_stopping_patience: 10
  early_stopping_min_delta: 0.001
  log_every_n_steps: 50
wandb:
  run_name: baseline-mfcc
seed: 42
output_dir: outputs/
